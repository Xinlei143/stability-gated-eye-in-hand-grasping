schema_version: 1
name: core_baseline_formal

defaults:
  target_model: cube

  execute_motion: true
  run_grasp_pipeline: true
  record_benchmark: true
  use_rviz: false
  grasp_assist_mode: "off"
  grasp_assist_service: ""

  perception_source: ground_truth

  latency_ms: 0.0
  noise_std_mm: 0.0
  dropout_probability: 0.0
  outlier_probability: 0.0
  outlier_range_mm: 0.0

  velocity_x: 0.01
  velocity_y: 0.0
  velocity_z: 0.0

  move_duration: 4.0
  stop_duration: 6.0

  stability_duration: 5.0
  position_spread_threshold: 0.006
  minimum_stable_samples: 25
  observation_timeout: 1.0

  timeout_s: 90.0

methods:
  - snapshot
  - tracking
  - gated

trajectories:
  - static
  - move_stop

