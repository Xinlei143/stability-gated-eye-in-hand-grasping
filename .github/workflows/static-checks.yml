name: static-checks

on:
  push:
  pull_request:

jobs:
  source-audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install static tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Shell syntax
        run: |
          bash -n install.sh
          for script in scripts/*.sh; do bash -n "$script"; done
      - name: ShellCheck
        run: shellcheck --severity=error -x install.sh scripts/*.sh
      - name: Python syntax
        run: |
          python3 -m py_compile \
            workspaces/app_ws/src/foam_grasp/foam_grasp/*.py \
            workspaces/app_ws/src/foam_grasp/launch/*.launch.py \
            training/*.py
      - name: No generated or secret runtime files
        run: |
          test "$(cat VERSION)" = "1.0.0"
          test ! -e runtime/models/best_model.pth
          test ! -e runtime/calibration/handeye_eye_in_hand.json
          test -s dependencies/orbbec.repos
          test -s dependencies/piper.repos
          test -s dependencies/moveit.repos
          test -s config/runtime-release.env
